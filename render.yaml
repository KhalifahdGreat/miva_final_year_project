# Render Blueprint — one-click deploy.
#
# This file lives at the repository root (Render only reads render.yaml from
# the root). The application itself lives in the sme_chatbot/ subdirectory,
# referenced below via `rootDir`.
#
# Before clicking "Apply" you supply the secret env vars (sync: false) in the
# Render UI: DATABASE_URL, REDIS_URL, GROQ_API_KEY, MILVUS_URI, MILVUS_TOKEN.
# WhatsApp values can stay blank until Meta onboarding is complete.
#
# Two services share one Docker image: a web service (FastAPI) and a
# background worker (RQ), wired to the same secrets via an env-group.

services:
  - type: web
    name: sme-chatbot-api
    runtime: docker
    plan: starter            # ~$7/mo
    region: frankfurt
    rootDir: sme_chatbot
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: SERVICE_ROLE
        value: web
      # One gunicorn worker on the 512 MB starter tier: each worker lazily
      # loads the ONNX embedder (~250 MB), so two would risk OOM. Scale this
      # up once the instance has more RAM.
      - key: WEB_CONCURRENCY
        value: 1
      - fromGroup: sme-chatbot-shared

  - type: worker
    name: sme-chatbot-worker
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: sme_chatbot
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: SERVICE_ROLE
        value: worker
      - fromGroup: sme-chatbot-shared

envVarGroups:
  - name: sme-chatbot-shared
    envVars:
      # Required — supply these in the Render UI before first deploy.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false

      # LLM / engine settings (safe defaults).
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: OFOFO_EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

      # Managed Milvus (Zilliz Cloud). Shared by the web + worker services so
      # documents ingested by the worker are visible to the web service.
      - key: MILVUS_URI
        sync: false
      - key: MILVUS_TOKEN
        sync: false

      # Object storage (Cloudflare R2, S3-compatible). Leave blank to keep
      # using ephemeral container disk; set to persist uploaded documents.
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

      # WhatsApp Cloud API. Leave blank until Meta onboarding is complete.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: META_GRAPH_API_BASE
        value: https://graph.facebook.com/v20.0

      # Browser CORS allow-list (comma-separated): the admin dashboard + any
      # sites embedding the widget.
      - key: WIDGET_ALLOWED_ORIGINS
        value: https://sme-chatbot.netlify.app
