[project]
name = "sme-chatbot"
version = "0.1.0"
description = "AI-Powered Multilingual Customer Service Chatbot for Nigerian SMEs"
requires-python = ">=3.11"
authors = [{ name = "Project Owner" }]
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "gunicorn==23.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",

    # Database
    "psycopg[binary,pool]==3.2.*",
    "alembic==1.13.*",
    "sqlalchemy==2.*",

    # Background jobs
    "redis==5.*",
    "rq==1.16.*",

    # Vector + embeddings (reuses the shared corpus via ofofo_engine)
    "pymilvus==2.4.*",
    "sentence-transformers==3.*",

    # LLM provider
    "groq==0.11.*",

    # Channel integrations
    "httpx==0.27.*",

    # Document parsing for ingestion
    "pypdf==4.*",
    "python-docx==1.*",
    "openpyxl==3.*",
    "pandas==2.*",

    # Observability
    "langfuse==2.*",
    "sentry-sdk[fastapi]==2.*",
    "structlog==24.*",

    # Object storage (Cloudflare R2 via S3 API)
    "boto3==1.34.*",

    # Utilities
    "python-dotenv==1.*",
    "python-multipart==0.0.*",
    "tenacity==8.*",

    # Local dependency on the shared engine
    # (uncomment when packaging; for dev we rely on PYTHONPATH — see Makefile)
    # "ofofo_engine @ file:///${PROJECT_ROOT}/../../ofofo_engine",
]

[project.optional-dependencies]
dev = [
    "ruff==0.6.*",
    "mypy==1.*",
    "pytest==8.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.*",
    "freezegun==1.*",
    "httpx==0.27.*",
    "respx==0.21.*",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Editable install: list the top-level packages that ship with sme-chatbot.
# The shared engine lives at ../../ofofo_engine and is reached at runtime via
# PYTHONPATH (see Makefile), so we deliberately do NOT include it here.
packages = ["core", "adapters", "app", "app.routers", "app.workers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
