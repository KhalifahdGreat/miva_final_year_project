services:
  postgres:
    image: postgres:16-alpine
    container_name: sme-chatbot-postgres
    environment:
      # Local-only defaults; override by exporting these before `docker compose up`.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sme_chatbot}
    # Host port 5433 so we don't collide with other projects already using 5432.
    # Inside the container it's still 5432 — only the host mapping changes.
    ports:
      - "5433:5432"
    volumes:
      - sme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sme-chatbot-redis
    # Host port 6380 to avoid the conflict above.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sme_postgres_data:
